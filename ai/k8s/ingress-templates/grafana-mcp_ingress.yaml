# Template — see v4m-mcp_ingress.yaml for the shape; this one additionally
# handles CORS at the ingress layer rather than relying on the grafana-mcp
# binary's own --allowed-origins flag, which was confirmed NOT to produce
# working CORS headers (unlike v4m-mcp-server, which handles its own CORS
# correctly in app.py and doesn't need this). mcp-session-id must be exposed
# so the MCP streamable-http JS client can read it from the initialize
# response — see the CORS comment in ai/app.py for the full explanation.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-mcp-server
  namespace: monitoring
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS, DELETE"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Accept,mcp-session-id,mcp-protocol-version"
    nginx.ingress.kubernetes.io/cors-expose-headers: "mcp-session-id"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "false"
    nginx.ingress.kubernetes.io/upstream-vhost: "localhost:8000"
    # Same SSE/long-lived-connection reasoning as v4m-mcp_ingress.yaml: the
    # MCP JS client may hold a standing GET connection open against this
    # server too, and nginx's default response buffering + 60s idle read
    # timeout can abruptly reset it, surfacing as net::ERR_HTTP2_PROTOCOL_ERROR
    # in the browser.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
  - host: grafana-mcp.host.cluster.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana-mcp-server
            port:
              number: 8000
  tls:
  - hosts:
    - grafana-mcp.host.cluster.example.com
    secretName: grafana-mcp-ingress-tls-secret
