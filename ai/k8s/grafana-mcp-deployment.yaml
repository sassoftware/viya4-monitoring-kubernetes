apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp-server
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana-mcp-server
  template:
    metadata:
      labels:
        app: grafana-mcp-server
    spec:
      containers:
      - name: mcp
        image: docker.io/grafana/mcp-grafana:1.0.0
        imagePullPolicy: Always
        args:
        - "-t"
        - "streamable-http"
        - "--address"
        - ":8000"
        - "--endpoint-path"
        - "/mcp"
        - "--allowed-origins=$(ALLOWED_ORIGIN)"
        - "--disable-write"          # this endpoint has no auth of its own yet; keep it read-only
        - "--tls-skip-verify"
        ports:
        - containerPort: 8000
        env:
        - name: GRAFANA_URL
          # deploy_ai_chatbot.sh patches this to <scheme>://v4m-grafana.monitoring.svc:3000
          # at deploy time, scheme derived from TLS_ENABLE (override with
          # GRAFANA_INTERNAL_SCHEME) — the value below only applies if you apply
          # this file directly.
          value: "https://v4m-grafana.monitoring.svc:3000"
        - name: GRAFANA_USERNAME
          value: "admin"
        - name: GRAFANA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: v4m-grafana
              key: admin-password
        - name: ALLOWED_ORIGIN
          value: "https://grafana.vizsax-eks-con-aws-nginx-4ffea33e.unx.sas.com"
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        startupProbe:
          tcpSocket:
            port: 8000
          periodSeconds: 5
          failureThreshold: 30
