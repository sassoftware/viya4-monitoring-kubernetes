---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: v4m-mcp-cache
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
  # storageClassName: gp3   # EKS example; AKS: managed-csi, GKE: standard-rwo — uncomment to pin, omit for the cluster default
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: v4m-mcp-pdfs
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
  # storageClassName: gp3   # EKS example; AKS: managed-csi, GKE: standard-rwo — uncomment to pin, omit for the cluster default
