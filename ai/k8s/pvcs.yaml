---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: v4m-mcp-cache
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
  # storageClassName: managed-csi   # uncomment to pin an AKS StorageClass; omit for the cluster default
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: v4m-mcp-pdfs
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
  # storageClassName: managed-csi
