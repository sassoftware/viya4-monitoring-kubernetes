# Sample: gateway-api/path-based Version: 0.1.0 (POC)

# REFERENCE ONLY -- see the comments in
# samples/gateway-api/path-based/monitoring/gateway.yaml for a full explanation,
# including why no "root proxy" equivalent is needed with Gateway API.

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: v4m-gateway
spec:
  gatewayClassName: contour
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: logging.host.cluster.example.com
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: logging.host.cluster.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: v4m-ingress-tls-secret
      allowedRoutes:
        namespaces:
          from: Same
