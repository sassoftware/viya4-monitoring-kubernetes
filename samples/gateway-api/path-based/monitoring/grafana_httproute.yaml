# Sample: gateway-api/path-based Version: 0.1.0 (POC)

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: v4m-grafana
spec:
  parentRefs:
    - name: v4m-gateway
      sectionName: https
  rules:
    # Rule 1 -- trailing-slash redirect.
    #
    # An Exact match on the unslashed path that redirects to the slashed form.
    # This is the portable replacement for the regex rewrite the deprecated
    # ingress-nginx sample used, and it avoids that approach's problems with
    # special characters in URLs.  Regex path matching is explicitly
    # implementation-specific in the Gateway API spec, so it is not used here.
    #
    # Rule order matters: Gateway API resolves ties by match type, and Exact
    # outranks PathPrefix, so a request for exactly "/grafana" hits this rule
    # while "/grafana/anything" falls through to rule 2.
    - matches:
        - path:
            type: Exact
            value: /grafana
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /grafana/
            statusCode: 302

    # Rule 2 -- the actual route.  No path rewrite: Grafana is configured with
    # serve_from_sub_path=true (see user-values-prom-operator.yaml), so it
    # expects to receive the /grafana prefix intact.
    - matches:
        - path:
            type: PathPrefix
            value: /grafana/
      backendRefs:
        - name: v4m-grafana
          port: 3000

# Backend re-encryption is configured by BackendTLSPolicy; see
# backendtlspolicies.yaml in this directory.
