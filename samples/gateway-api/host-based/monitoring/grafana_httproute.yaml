# Sample: gateway-api/host-based Version: 0.1.0 (POC)

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: v4m-grafana
spec:
  parentRefs:
    - name: v4m-gateway
      sectionName: https
  hostnames:
    - grafana.host.cluster.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: v4m-grafana
          port: 3000

# NOTE: Gateway API has no per-backendRef "use TLS to the backend" field, which
# is what `protocol: tls` does on a Contour HTTPProxy service.  Backend
# re-encryption is configured out-of-band by a BackendTLSPolicy resource that
# targets the Service.  See backendtlspolicies.yaml in this directory.
