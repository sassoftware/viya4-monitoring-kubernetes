# Sample: gateway-api/host-based Version: 0.1.0

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: v4m-grafana
spec:
  parentRefs:
    - kind: ListenerSet
      name: v4m-listenerset
      sectionName: https
  hostnames:
    - grafana.monitoring.host.cluster.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: v4m-grafana
          port: 3000
