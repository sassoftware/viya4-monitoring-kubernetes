# Optional: override the default NetworkPolicy that restricts access to the
# Kube State Metrics (KSM) service to Prometheus pods only. This file is only
# used if it exists at $USER_DIR/monitoring/networkPolicy-kube-state-metrics.yaml;
# otherwise the project's default (shown below) is applied automatically --
# you do not need to copy this file unless you want to customize the rules
# (e.g. allow an additional scraper) or you already manage a NetworkPolicy of
# your own with the same name in the monitoring namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics
  labels:
    sas.com/monitoring-base: kube-viya-monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 8080
