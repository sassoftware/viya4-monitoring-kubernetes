# Custom Resource Definitions for the Prometheus Operator
# https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md

# All 'enabled' values default to true. Set the respective 'enabled' value to
# false to disable deployment of that component.

# Setting the 'externalUrl', 'domain' and 'root_url' values is optional, but will
# ensure cross-component (e.g. Grafana->Prometheus) and alert links are correct.

# prometheusOperator:
#   enabled: true

# kubelet:
  # serviceMonitor:
    # Default to use the https-metrics endpoint
    # Depending on your environment, this may require configuration
    # changes to the kubelet.
    # See issue: https://github.com/coreos/prometheus-operator/issues/926
    # https: true

# Use this snippit to change URL, storage, or retention 
# prometheus:
#   enabled: true
#   prometheusSpec:
#     externalUrl: http://host.mycluster.example.com:31090
#     retention: 7d
#     retentionSize: 20GiB
#     storageSpec:
#       volumeClaimTemplate:
#         spec:
#           storageClassName: myCustomStorageClass
#           resources:
#             requests:
#               storage: 25Gi

# alertmanager:
#   enabled: true
#   alertmanagerSpec:
#     externalUrl: http://host.mycluster.example.com:31091
#     storage:
#       volumeClaimTemplate:
#         spec:
#           storageClassName: myCustomStorageClass

# grafana:
#   enabled: true
#   adminPassword: yourSecretPasswordHere
#   initChownData:
#     enabled: false
#   "grafana.ini":
#     # Specifying domain and root_url will create the correct links in alert notifications
#     server:
#       domain: host.mycluster.example.com
#       # This value should change to ingress host/port/path if configured
#       root_url: http://host.mycluster.example.com:31100/
#   persistence:
#     storageClassName: myCustomStorageClass

# nodeExporter:
#   enabled: true

# Kube State Metrics and Node Exporter are each protected by a default
# NetworkPolicy that restricts ingress to Prometheus pods only. Override
# these values to customize the ingress rules (e.g. allow an additional
# scraper), or set 'enabled: false' if you already manage a NetworkPolicy of
# your own with the same name in the monitoring namespace. See
# https://kubernetes.io/docs/concepts/services-networking/network-policies/
# for details on defining a NetworkPolicy resource.
# kube-state-metrics:
#   networkPolicy:
#     enabled: true
#     ingress:
#       - from:
#           - podSelector:
#               matchLabels:
#                 app.kubernetes.io/name: prometheus
#         ports:
#           - protocol: TCP
#             port: 8080
#     egress:
#       - {}

# prometheus-node-exporter:
#   networkPolicy:
#     enabled: true
#     ingress:
#       - from:
#           - podSelector:
#               matchLabels:
#                 app.kubernetes.io/name: prometheus
#         ports:
#           - protocol: TCP
#             port: 9110
#     # NOTE: this chart has no supported way to open egress once
#     # networkPolicy.enabled=true -- any 'egress' value here is ignored and
#     # ALL egress from Node Exporter pods will be denied.
