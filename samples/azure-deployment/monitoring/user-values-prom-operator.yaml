# Access to the web applications (Contour HTTPProxy resources, routePrefix,
# externalUrl and grafana.ini server settings) is auto-generated from the
# AUTOGENERATE_INGRESS settings in ../user.env, StorageClass references from
# STORAGECLASS in ../user.env (AUTOGENERATE_STORAGECLASS=true).
# Values set here are passed to Helm after the auto-generated values and
# override them. Do not set ingress, routePrefix, externalUrl, grafana.ini
# server or storageClassName keys here unless you want to override the
# auto-generated values.

grafana:
  # Disable default configuration of NodePort
  service:
    type: ClusterIP
    nodePort: null
