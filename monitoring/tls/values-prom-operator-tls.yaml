prometheus:
  prometheusSpec:
    web:
      tlsConfig:
        clientAuthType: NoClientCert
        keySecret:
          key: tls.key
          name: prometheus-tls-secret
        cert:
          secret:
            key: tls.crt
            name: prometheus-tls-secret
  service:
    port: 9090
    targetPort: 9090
  serviceMonitor:
    scheme: https
    tlsConfig:
      insecureSkipVerify: true

alertmanager:
  alertmanagerSpec:
    web:
      tlsConfig:
        clientAuthType: NoClientCert
        keySecret:
          key: tls.key
          name: alertmanager-tls-secret
        cert:
          secret:
            key: tls.crt
            name: alertmanager-tls-secret
  service:
    port: 9093
    targetPort: 9093
  serviceMonitor:
    scheme: https
    tlsConfig:
      insecureSkipVerify: true

prometheus-node-exporter:
  # Node Exporter binds to localhost only; kube-rbac-proxy is deployed as a
  # sidecar and is the sole externally-reachable entry point, enforcing
  # Kubernetes RBAC (SubjectAccessReview) via a bearer token before
  # forwarding to Node Exporter. Same pattern used for kube-state-metrics.
  # See: https://github.com/prometheus-community/helm-charts/tree/main/charts/prometheus-node-exporter#tls-and-client-certificate-authentication
  kubeRBACProxy:
    enabled: true
  prometheus:
    monitor:
      # kube-rbac-proxy terminates TLS with a self-signed cert (no cert
      # management required) and authenticates the scrape using Prometheus's
      # own ServiceAccount token.
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token

grafana:
  readinessProbe:
    httpGet:
      scheme: HTTPS
      port: 3000
  livenessProbe:
    httpGet:
      scheme: HTTPS
      port: 3000
  extraSecretMounts:
    - name: grafana-tls
      mountPath: /cert
      secretName: grafana-tls-secret
      readOnly: true
      subPath: ""
  service:
    port: 3000
    targetPort: 3000
  sidecar:
    dashboards:
      reloadURL: "https://localhost:3000/api/admin/provisioning/dashboards/reload"
      env:
        REQ_SKIP_TLS_VERIFY: true
    datasources:
      defaultDatasourceEnabled: false
      reloadURL: "https://localhost:3000/api/admin/provisioning/datasources/reload"
      env:
        REQ_SKIP_TLS_VERIFY: true
  serviceMonitor:
    scheme: https
    tlsConfig:
      insecureSkipVerify: true
  "grafana.ini":
    server:
      protocol: https
      cert_file: /cert/tls.crt
      cert_key: /cert/tls.key
